}

/* -------------------------------------------------------- profile editor - */
VIEWS.edit = () => {
  const c = myCreator();
  if (!c) return `<section class="wrap" style="padding:60px 0"><div class="empty">${ico("user")}<div>You don't have a creator profile yet.</div><button class="btn accent" data-go="account">Go to account</button></div></section>`;
  return `
  <section class="wrap" id="editRoot" style="padding-top:30px;max-width:900px">
    <div class="sec-head"><div><div class="sec-eyebrow">Public profile</div><h1 style="font-size:clamp(26px,3.2vw,38px)">Edit how clients see you</h1></div>
      <div class="row" style="gap:8px"><button class="btn" data-go="studio">${ico("arrow")} Back to studio</button></div>
    </div>

    <div class="card pad">
      <div class="row" style="gap:16px;align-items:center;margin-bottom:18px">
        ${avatarHTML(c.name, 72, c.id)}
        <div><div class="small muted">Your avatar is generated from your name — a matte gradient, no uploads needed in this build.</div></div>
      </div>
      <div class="grid g-2" style="gap:16px">
        <div class="field"><div class="label">Display name</div><input class="input" id="edName" value="${esc(c.name)}"></div>
        <div class="field"><div class="label">Primary category</div>
          <select class="select" id="edCat">${CATEGORIES.map(x => `<option ${c.category === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        <div class="field" style="grid-column:1/-1"><div class="label">Headline — one line that sells you</div>
          <input class="input" id="edHead" value="${esc(c.headline)}" placeholder="e.g. Wedding photographer — quiet, candid, unhurried frames"></div>
        <div class="field"><div class="label">City</div><input class="input" id="edCity" value="${esc(c.city)}"></div>
        <div class="field"><div class="label">Starting rate (for the price filter)</div><input class="input" id="edRate" type="number" min="0" value="${c.rateFrom}"></div>
        <div class="field" style="grid-column:1/-1"><div class="label">About you</div>
          <textarea class="textarea" id="edBio" style="min-height:120px">${esc(c.bio)}</textarea></div>
        <div class="field" style="grid-column:1/-1"><div class="label">Skills (comma separated)</div>
          <input class="input" id="edSkills" value="${esc(c.skills.join(", "))}" placeholder="Weddings, Candid portraits, Album design"></div>
        <div class="field"><div class="label">Languages (comma separated)</div>
          <input class="input" id="edLangs" value="${esc(c.languages.join(", "))}"></div>
        <div class="field"><div class="label">Working mode</div>
          <div class="row wrap-row" style="gap:6px">
            ${MODES.map(m => `<button class="chip ${c.modes.includes(m) ? "on" : ""}" data-edmode="${m}">${m}</button>`).join("")}
          </div></div>
        <label class="row" style="gap:9px;grid-column:1/-1;cursor:pointer;align-items:center">
          <input type="checkbox" id="edVerified" ${c.verified ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--sage)">
          <span class="small">Show the verified tick (demo only — in production this comes from ID + portfolio review)</span>
        </label>
      </div>
      <div class="divider"></div>
      <div class="between">
        <div class="xs faint">Changes appear on your public profile immediately.</div>
        <button class="btn accent" id="saveProfile">${ico("check")} Save profile</button>
      </div>
    </div>
  </section>`;
};

AFTER.edit = () => {
  const root = $("#editRoot"); if (!root) return;
  const c = myCreator(); if (!c) return;
  root.onclick = (e) => {
    const m = e.target.closest("[data-edmode]");
    if (m) {
      const v = m.dataset.edmode;
      c.modes = c.modes.includes(v) ? c.modes.filter(x => x !== v) : c.modes.concat(v);
      if (!c.modes.length) c.modes = [v];
      saveDB(); m.classList.toggle("on"); return;
    }
    if (e.target.closest("#saveProfile")) {
      const name = $("#edName").value.trim() || c.name;
      c.name = name; c.category = $("#edCat").value; c.headline = $("#edHead").value.trim() || c.headline;
      c.city = $("#edCity").value.trim() || c.city;
      c.rateFrom = Number($("#edRate").value) || c.rateFrom;
      c.bio = $("#edBio").value.trim();
      c.skills = $("#edSkills").value.split(",").map(s => s.trim()).filter(Boolean);
      c.languages = $("#edLangs").value.split(",").map(s => s.trim()).filter(Boolean);
      c.verified = $("#edVerified").checked;
      c.cover = grad(c.name + "cover");
      const u = currentUser(); if (u) u.name = name;
      saveDB(); toast("Profile saved"); go("studio");
    }
  };
};

/* ----------------------------------------------------------------- auth -- */
VIEWS.auth = (_, params) => {
  const mode = (parseHash().params.get("mode") || "signin");
  const next = parseHash().params.get("next") || "";
  return `
  <section class="wrap" style="padding:44px 0 20px;max-width:960px">
    <div class="grid" style="grid-template-columns:1fr;gap:26px">
      <div class="center">
        <span class="eyebrow"><span class="dot"></span> ${next ? "Sign in to finish your booking" : "Two doors, one marketplace"}</span>
        <h1 style="font-size:clamp(26px,3.4vw,40px);margin-top:14px">${mode === "join" ? "Put your craft on the market" : "Welcome back"}</h1>
        <p class="muted small" style="margin-top:8px">${mode === "join" ? "List your services with clear charges, publish your availability, and let clients come to you." : "Sign in as a client to book, or as a creator to manage requests."}</p>
      </div>

      <div class="auth-card card pad" id="authCard">
        <div class="tabs" style="width:100%;margin-bottom:18px" id="authTabs">
          <button class="tab ${mode !== "join" ? "on" : ""}" data-auth="signin" style="flex:1">Sign in</button>
          <button class="tab ${mode === "join" ? "on" : ""}" data-auth="join" style="flex:1">Create account</button>
          <span class="tab-glider" style="width:0"></span>
        </div>

        <div id="authForm"></div>

        <div class="divider"></div>
        <div class="sec-eyebrow">Or jump straight in with a demo account</div>
        <div class="col" style="gap:6px;margin-top:8px">
          ${[
            ["client@kalaa.app", "Aarav Sharma", "Client — books creators"],
            ["aanya@kalaa.app", "Aanya Mehra", "Creator — photographer with live requests"],
            ["kabir@kalaa.app", "Kabir Sethi", "Creator — music producer"],
            ["tara@kalaa.app", "Tara Menon", "Creator — yoga teacher"]
          ].map(([em, nm, desc]) => `
            <div class="lb-row" style="cursor:pointer;padding:10px 8px" data-demo="${em}">
              ${avatarHTML(nm, 32, em)}
              <div class="grow"><div class="small" style="font-weight:500">${esc(nm)}</div><div class="xs faint">${esc(desc)}</div></div>
              <span class="xs muted">enter ${ico("arrow")}</span>
            </div>`).join("")}
        </div>
        <div class="xs faint" style="margin-top:10px">All demo passwords are <span class="kbd">demo1234</span>. Data never leaves this browser.</div>
      </div>
    </div>
  </section>`;
};

function authFormHTML(mode) {
  if (mode === "join") {
    return `
      <div class="field" style="margin-bottom:14px">
        <div class="label">I'm joining as</div>
        <div class="role-pick">
          <button class="role-opt ${UI.authRole !== "creator" ? "on" : ""}" data-role="client">
            ${ico("briefcase")}<div style="font-weight:600">A client</div><div class="xs muted">I want to book creators</div>
          </button>
          <button class="role-opt ${UI.authRole === "creator" ? "on" : ""}" data-role="creator">
            ${ico("spark")}<div style="font-weight:600">A creator</div><div class="xs muted">I want to sell my services</div>
          </button>
        </div>
      </div>
      <div class="col" style="gap:12px">
        <div class="field"><div class="label">${UI.authRole === "creator" ? "Name (as clients will see it)" : "Full name"}</div><input class="input" id="auName" placeholder="e.g. Riya Kapoor"></div>
        <div class="grid g-2" style="gap:12px">
          <div class="field"><div class="label">Email</div><input class="input" id="auEmail" type="email" placeholder="you@example.com"></div>
          <div class="field"><div class="label">City</div><input class="input" id="auCity" placeholder="Phagwara"></div>
        </div>
        <div class="field"><div class="label">Password</div><input class="input" id="auPass" type="password" placeholder="At least 6 characters"></div>
        ${UI.authRole === "creator" ? `
          <div class="field"><div class="label">What do you do? (primary category)</div>
            <select class="select" id="auCat">${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
          <div class="field"><div class="label">Headline</div><input class="input" id="auHead" placeholder="One line that makes a client click"></div>
        ` : ""}
      </div>
      <button class="btn primary block mt-16" id="doJoin" style="margin-top:16px">${ico("arrow")} Create my account</button>`;
  }
  return `
    <div class="col" style="gap:12px">
      <div class="field"><div class="label">Email</div><input class="input" id="auEmail" type="email" placeholder="you@example.com"></div>
      <div class="field"><div class="label">Password</div><input class="input" id="auPass" type="password" placeholder="Your password"></div>
      <button class="btn primary block" id="doSignin">${ico("arrow")} Sign in</button>
      <div class="xs faint center">Try <span class="kbd">client@kalaa.app</span> or <span class="kbd">aanya@kalaa.app</span> with <span class="kbd">demo1234</span></div>
    </div>`;
}

AFTER.auth = () => {
  const card = $("#authCard"); if (!card) return;
  const mode = () => (parseHash().params.get("mode") || "signin");
  UI.authRole = UI.authRole || "client";

  const glider = () => {
    const g = $(".tab-glider", $("#authTabs")); const on = $(".tab.on", $("#authTabs"));
    if (!g || !on) return;
    g.style.width = on.offsetWidth + "px";
    g.style.transform = `translateX(${on.offsetLeft - 4}px)`;
  };
  const paintForm = () => { $("#authForm").innerHTML = authFormHTML(mode()); glider(); };
  paintForm();
  requestAnimationFrame(glider);

  card.onclick = (e) => {
    const t = e.target.closest("[data-auth]");
    if (t) {
      const m = t.dataset.auth;
      location.hash = m === "join" ? "#/auth?mode=join" : "#/auth";
      return;
    }
    const r = e.target.closest("[data-role]");
    if (r) { UI.authRole = r.dataset.role; paintForm(); return; }

    const demo = e.target.closest("[data-demo]");
    if (demo) {
      const u = DB.users.find(x => x.email === demo.dataset.demo);
      if (!u) { toast("Demo account missing — reset the data", "bad"); return; }
      setSession(u.id); paintChrome(); renderNotif();
      toast("Signed in as " + u.name);
      afterAuthRoute(u);
      return;
    }

    if (e.target.closest("#doSignin")) {
      const email = $("#auEmail").value.trim().toLowerCase();
      const pass = $("#auPass").value;
      const u = DB.users.find(x => x.email.toLowerCase() === email);
      if (!u || u.pw !== pass) { toast("Those credentials don't match", "bad"); return; }
      setSession(u.id); paintChrome(); renderNotif();
      toast("Welcome back, " + u.name.split(" ")[0]);
      afterAuthRoute(u);
      return;
    }

    if (e.target.closest("#doJoin")) {
      const name = $("#auName").value.trim();
      const email = $("#auEmail").value.trim().toLowerCase();
      const pass = $("#auPass").value;
      const city = $("#auCity").value.trim() || "India";
      if (!name) { toast("Add your name", "bad"); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("That email doesn't look right", "bad"); return; }
      if (DB.users.some(x => x.email.toLowerCase() === email)) { toast("That email is already registered — sign in instead", "bad"); return; }
      if (pass.length < 6) { toast("Password needs at least 6 characters", "bad"); return; }

      const role = UI.authRole || "client";
      const u = {
        id: uid("u"), role, name, email, pw: pass, city, createdAt: nowTs(),
        avatar: grad(name + email), phone: "", about: "", company: ""
      };
      DB.users.push(u);
      if (role === "creator") {
        const cat = ($("#auCat") || {}).value || CATEGORIES[0];
        const head = ($("#auHead") || {}).value.trim() || "New on Kalaa — tell clients what you do";
        DB.creators.push({
          id: uid("cr"), userId: u.id, name, handle: email.split("@")[0], headline: head,
          category: cat, city, country: "India",
          bio: "New here. Add a short bio so clients know exactly what you make and how you work.",
          skills: [], languages: ["English"], modes: ["Remote", "On-site"], rateFrom: 5000, currency: "INR",
          verified: false, responseRate: 100, joinedAt: nowTs(), bookedTotal: 0, cover: grad(name + "cover"),
          availability: { days: [1, 2, 3, 4, 5], slots: { Morning: true, Afternoon: true, Evening: false }, blocked: [], leadDays: 2, note: "" },
          services: [{ id: uid("sv"), title: "Your first service", category: cat, price: 5000, unit: "session", description: "Describe the deliverable, what's included and your turnaround time." }]
        });
        saveDB(); setSession(u.id); paintChrome(); renderNotif();
        toast("Creator account created — add your services");
        go("edit");
        return;
      }
      saveDB(); setSession(u.id); paintChrome(); renderNotif();
      toast("Welcome to Kalaa, " + name.split(" ")[0]);
      afterAuthRoute(u);
    }
  };
};

function afterAuthRoute(u) {
  const next = parseHash().params.get("next") || "";
  if (next.startsWith("book/")) {
    const [, cid, sid] = next.split("/");
    location.hash = "#/creator/" + cid;
    setTimeout(() => openBookingSheet(cid, sid || null), 420);
    return;
  }
  if (next && VIEWS[next.split("/")[0]]) { go(next.split("/")[0], next.split("/")[1]); return; }
  go(u.role === "creator" ? "studio" : "bookings");
}

/* --------------------------------------------------------- discover glue - */
AFTER.discover = () => {
  const root = $("#discoverRoot"); if (!root) return;
  mountFilterHosts();
  renderResults();

  const panelSync = () => { mountFilterHosts(); renderResults(); };

  root.addEventListener("input", debounce((e) => {
    const t = e.target;
    if (t.id === "qInput") { UI.filters.q = t.value; renderResults(); return; }
    if (t.dataset && t.dataset.f === "maxPrice") { UI.filters.maxPrice = Number(t.value); syncRangeLabels(); renderResults(); return; }
    if (t.dataset && t.dataset.f === "withinDays") { UI.filters.withinDays = Number(t.value); syncRangeLabels(); renderResults(); return; }
  }, 260));

  root.addEventListener("change", (e) => {
    const f = e.target.dataset && e.target.dataset.f;
    if (f === "city") { UI.filters.city = e.target.value; renderResults(); return; }
    if (f === "mode") { UI.filters.mode = e.target.value; renderResults(); return; }
    if (f === "sort") {
      UI.filters.sort = e.target.value;
      $$("[data-f='sort']").forEach(s => s.value = e.target.value);
      renderResults(); return;
    }
    if (f === "availableOnly") { UI.filters.availableOnly = e.target.checked; panelSync(); return; }
    if (f === "verifiedOnly") { UI.filters.verifiedOnly = e.target.checked; panelSync(); return; }
  });

  root.addEventListener("click", (e) => {
    const open = e.target.closest("[data-open]");
    if (open) { go("creator", open.dataset.open); return; }
    const b = e.target.closest("[data-f]"); if (!b) return;
    const f = b.dataset.f, v = b.dataset.v;
    if (f === "cat") {
      if (v === "__all") UI.filters.cats = [];
      else UI.filters.cats = UI.filters.cats.includes(v) ? UI.filters.cats.filter(x => x !== v) : UI.filters.cats.concat(v);
      panelSync(); syncQuickCats(); return;
    }
    if (f === "day") { UI.filters.day = v === "any" ? "any" : Number(v); panelSync(); return; }
    if (f === "minRating") { UI.filters.minRating = Number(v); panelSync(); return; }
    if (f === "mode") { UI.filters.mode = v; panelSync(); return; }
    if (f === "clear") {
      UI.filters = { ...UI.filters, q: "", cats: [], maxPrice: 0, minRating: 0, city: "any", mode: "any", day: "any", availableOnly: false, verifiedOnly: false, withinDays: 14 };
      const q = $("#qInput"); if (q) q.value = "";
      panelSync(); syncQuickCats(); return;
    }
    if (f === "apply") { renderResults(); return; }
    if (f === "openFilters") { openFiltersSheet(); return; }
  });

  const inp = $("#qInput");
  if (inp) inp.addEventListener("keydown", (e) => { if (e.key === "Enter") renderResults(); });

  function syncRangeLabels() {
    const f = UI.filters;
    const price = $("[data-f='maxPrice']"); const wrap = price ? price.parentElement : null;
    if (wrap) { const lab = wrap.querySelector("span"); if (lab) lab.textContent = f.maxPrice ? money(f.maxPrice) : "Any"; }
    const within = $("[data-f='withinDays']"); const w2 = within ? within.parentElement : null;
    if (w2) { const lab = w2.querySelector("span"); if (lab) lab.textContent = f.withinDays + " days"; }
    const cb = $("[data-f='availableOnly']"); if (cb) cb.checked = f.availableOnly;
    $$("[data-f='withinDays']").forEach(r => r.disabled = !f.availableOnly);
  }
  function syncQuickCats() {
    const host = $("#quickCats"); if (!host) return;
    $$("[data-f='cat']", host).forEach(b => {
      const v = b.dataset.v;
      b.classList.toggle("on", v === "__all" ? UI.filters.cats.length === 0 : UI.filters.cats.includes(v));
    });
  }
};

function openFiltersSheet() {
  Sheet.openWith({
    title: "Filters", sub: "Narrow the marketplace down to your brief",
    body: `<div id="filterHostSheet">${filterPanelHTML()}</div>`,
    foot: `<button class="btn" id="fltClear">Clear</button><button class="btn accent" id="fltDone">${ico("check")} Show results</button>`,
    onMount: (body) => {
      body.onclick = (e) => {
        const b = e.target.closest("[data-f]"); if (!b || b.dataset.f === "clear") return;
        const f = b.dataset.f, v = b.dataset.v;
        if (f === "cat") UI.filters.cats = UI.filters.cats.includes(v) ? UI.filters.cats.filter(x => x !== v) : UI.filters.cats.concat(v);
        if (f === "day") UI.filters.day = v === "any" ? "any" : Number(v);
        if (f === "minRating") UI.filters.minRating = Number(v);
        if (f === "mode") UI.filters.mode = v;
        $("#filterHostSheet").innerHTML = filterPanelHTML();
        refreshDiscover();
      };
      body.onchange = (e) => {
        const f = e.target.dataset && e.target.dataset.f;
        if (f === "city") UI.filters.city = e.target.value;
        if (f === "availableOnly") UI.filters.availableOnly = e.target.checked;
        if (f === "verifiedOnly") UI.filters.verifiedOnly = e.target.checked;
        $("#filterHostSheet").innerHTML = filterPanelHTML();
        refreshDiscover();
      };
      body.oninput = (e) => {
        const f = e.target.dataset && e.target.dataset.f;
        if (f === "maxPrice") UI.filters.maxPrice = Number(e.target.value);
        if (f === "withinDays") UI.filters.withinDays = Number(e.target.value);
        renderResults();
      };
      $("#fltClear").onclick = () => {
        UI.filters = { ...UI.filters, cats: [], maxPrice: 0, minRating: 0, city: "any", mode: "any", day: "any", availableOnly: false, verifiedOnly: false, withinDays: 14 };
        $("#filterHostSheet").innerHTML = filterPanelHTML(); refreshDiscover();
      };
      $("#fltDone").onclick = () => { Sheet.close(); refreshDiscover(); };
    }
  });
}

/* ---------------------------------------------------------- landing glue - */
AFTER.landing = () => {
  const root = $("#stage");
  root.onclick = (e) => {
    const cat = e.target.closest("[data-cat]");
    if (cat) { UI.filters.cats = [cat.dataset.cat]; location.hash = "#/discover"; setTimeout(() => refreshDiscover(), 300); return; }
    const open = e.target.closest("[data-open]");
    if (open) { go("creator", open.dataset.open); return; }
  };
};

/* ------------------------------------------------------------------ boot - */
function boot() {
  loadLocal();
  if (!DB || !DB.version || !Array.isArray(DB.creators) || !DB.creators.length) {
    DB = seedDB(); saveDB();
  }
  if (SESSION && !findUser(SESSION.userId)) setSession(null);

  const savedTheme = Store.get(THEME_KEY);
  applyTheme(savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("#yr").textContent = new Date().getFullYear();
  UI.authRole = "client";

  if (!location.hash) location.hash = "#/landing";
  renderRoute();
  paintChrome();
}
document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();
