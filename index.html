            <button class="btn sm" data-book="${c.id}">${ico("plus")} New request</button>
          </div>
          <div class="col" style="gap:10px;margin-top:10px">
            ${c.services.map(s => `
              <div class="svc" data-svc="${s.id}">
                <div class="svc-head">
                  <span style="color:var(--sage)">${ico("spark")}</span>
                  <div class="grow">
                    <div style="font-weight:600">${esc(s.title)}</div>
                    <div class="row" style="gap:8px;margin-top:4px;flex-wrap:wrap">
                      <span class="tag ${catColor(s.category)}">${esc(s.category)}</span>
                      <span class="xs muted">${esc(s.unit)} based</span>
                    </div>
                  </div>
                  <div style="text-align:right">
                    <div class="price">${money(s.price, c.currency)}</div>
                    <div class="xs faint">/ ${esc(s.unit)}</div>
                  </div>
                  <span class="svc-chev">${ico("chev")}</span>
                </div>
                <div class="svc-body">
                  <p class="small soft" style="line-height:1.65;margin-bottom:12px">${esc(s.description)}</p>
                  <div class="row wrap-row" style="gap:8px">
                    <button class="btn accent sm" data-book="${c.id}" data-svc="${s.id}">${ico("cal")} Book this service</button>
                    ${u && bookingWith(c.id) ? `<button class="btn sm" data-thread="${bookingWith(c.id).id}">${ico("msg")} Message</button>` : ""}
                  </div>
                </div>
              </div>`).join("")}
          </div>
        </div>

        <div class="card pad" id="reviewBlock">
          <div class="between" style="align-items:flex-start">
            <div>
              <div class="sec-eyebrow">Client reviews</div>
              <h3>${st.count ? `${st.avg.toFixed(1)} out of 5 · ${st.count} verified reviews` : "No reviews yet"}</h3>
            </div>
            ${bookableBooking ? `<button class="btn accent sm" data-review="${bookableBooking.id}">${ico("star")} Write a review</button>` : ""}
          </div>

          ${st.count ? `
            <div class="row" style="gap:22px;margin-top:16px;flex-wrap:wrap">
              <div class="center" style="min-width:130px">
                <div style="font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1">${st.avg.toFixed(1)}</div>
                ${starsHTML(st.avg, "lg")}
                <div class="xs muted mt-6">${st.points} total points</div>
              </div>
              <div class="grow" style="min-width:200px">
                ${[5, 4, 3, 2, 1].map(k => `
                  <div class="row" style="gap:9px;padding:3px 0">
                    <span class="xs muted" style="width:26px">${k}★</span>
                    <div class="bar grow"><i style="width:${st.count ? (st.dist[k - 1] / st.count) * 100 : 0}%"></i></div>
                    <span class="xs faint" style="width:22px;text-align:right">${st.dist[k - 1]}</span>
                  </div>`).join("")}
              </div>
            </div>
            <div class="divider"></div>
          ` : `<p class="small muted mt-10">Reviews appear here after a client completes a booking with this creator. Only real, completed bookings can be reviewed.</p>`}

          ${revs.length ? revs.map(r => {
            const cu = findUser(r.clientId) || { name: "Client" };
            return `<div class="review">
              <div class="row" style="gap:11px">
                ${avatarHTML(cu.name, 40, cu.id || cu.name)}
                <div class="grow">
                  <div class="between">
                    <div><div style="font-weight:600;font-size:14px">${esc(cu.name)}</div>
                    <div class="xs faint">${timeAgo(r.createdAt)}</div></div>
                    ${starsHTML(r.rating)}
                  </div>
                </div>
              </div>
              ${r.text ? `<div class="review-q">“${esc(r.text)}”</div>` : ""}
              ${(r.tags || []).length ? `<div class="row wrap-row" style="gap:6px;margin-top:9px">${r.tags.map(t => `<span class="tag sage">${esc(t)}</span>`).join("")}</div>` : ""}
              ${r.reply ? `<div class="notice" style="margin-top:10px;background:var(--surface-2)">${ico("msg")}
                <div><strong>${esc(c.name)} replied:</strong> ${esc(r.reply)}</div></div>` : ""}
            </div>`;
          }).join("") : ""}
        </div>

        ${similar.length ? `
        <div class="card pad">
          <div class="sec-eyebrow">Similar creators in ${esc(c.category)}</div>
          <div class="col" style="gap:6px;margin-top:8px">
            ${similar.map(x => `
              <div class="lb-row" style="cursor:pointer" data-open="${x.creator.id}">
                ${avatarHTML(x.creator.name, 40, x.creator.id)}
                <div class="grow">
                  <div class="small" style="font-weight:600">${esc(x.creator.name)}</div>
                  <div class="xs muted truncate">${esc(x.creator.headline)}</div>
                </div>
                <span class="rating-pill">${x.stats.count ? x.stats.avg.toFixed(1) : "New"}</span>
              </div>`).join("")}
          </div>
        </div>` : ""}
      </div>
    </div>
  </section>`;
};

const bookingWith = (creatorId) => {
  const u = currentUser(); if (!u) return null;
  return DB.bookings.filter(b => b.creatorId === creatorId && b.clientId === u.id)
    .sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
};

/* ------------------------------------------------------ booking request -- */
function openBookingSheet(creatorId, serviceId, preset) {
  const c = findCreator(creatorId);
  if (!c) return;
  if (!currentUser()) {
    Sheet.close();
    toast("Sign in to send a booking request", "bad");
    location.hash = "#/auth?next=book/" + creatorId + (serviceId ? "/" + serviceId : "");
    return;
  }
  const days = bookableDays(c, 30).filter(d => d.free);
  const state = {
    serviceId: serviceId || (c.services[0] && c.services[0].id),
    date: (preset && preset.date) || (days[0] && days[0].date),
    slot: (preset && preset.slot) || null,
    mode: c.modes[0],
    brief: ""
  };
  if (!state.slot && state.date) state.slot = slotOpenOn(c, state.date).filter(s => !takenSlots(c.id, state.date).includes(s))[0] || null;

  const body = () => {
    const svc = c.services.find(s => s.id === state.serviceId) || c.services[0];
    const openSlots = state.date ? slotOpenOn(c, state.date).filter(s => !takenSlots(c.id, state.date).includes(s)) : [];
    return `
      <div class="col" style="gap:20px">
        <div class="row" style="gap:12px">
          ${avatarHTML(c.name, 52, c.id)}
          <div class="grow">
            <div style="font-weight:600">${esc(c.name)}</div>
            <div class="xs muted">${esc(c.category)} · ${esc(c.city)} · ${esc(availabilityLabel(c))}</div>
          </div>
          ${c.verified ? `<span class="verified">${ico("badge")}</span>` : ""}
        </div>

        <div class="field">
          <div class="label">1 · Which service?</div>
          <div class="col" style="gap:8px">
            ${c.services.map(s => `
              <label class="role-opt ${state.serviceId === s.id ? "on" : ""}" data-pick-service="${s.id}" style="display:flex;align-items:center;gap:12px;padding:12px 14px">
                <div class="grow">
                  <div style="font-weight:500;font-size:14px">${esc(s.title)}</div>
                  <div class="xs muted" style="margin-top:3px">${esc(s.category)} · billed per ${esc(s.unit)}</div>
                </div>
                <div class="price">${money(s.price, c.currency)}</div>
              </label>`).join("")}
          </div>
        </div>

        <div class="field">
          <div class="label">2 · Pick a day they're free</div>
          <div class="days-rail">
            ${bookableDays(c, 30).map(d => {
              const dd = new Date(d.date + "T00:00:00");
              return `<button class="day-pick ${d.free ? "" : "off"} ${state.date === d.date ? "on" : ""}" ${d.free ? `data-pick-day="${d.date}"` : "disabled"}>
                <div class="dp-w">${WD[dd.getDay()]}</div>
                <div class="dp-d">${dd.getDate()}</div>
                <div class="xs" style="opacity:.7">${MONTHS[dd.getMonth()]}</div>
              </button>`;
            }).join("")}
          </div>
        </div>

        <div class="field">
          <div class="label">3 · Time slot</div>
          <div class="row wrap-row" style="gap:7px">
            ${SLOTS.map(s => {
              const ok = openSlots.includes(s);
              return `<button class="chip ${state.slot === s ? "on" : ""}" ${ok ? `data-pick-slot="${s}"` : "disabled style=opacity:.42;cursor:not-allowed"}>${ico("clock")} ${s}${ok ? "" : " · taken"}</button>`;
            }).join("")}
          </div>
          <div class="xs faint">Exact timings are agreed once the creator accepts.</div>
        </div>

        <div class="row" style="gap:16px;flex-wrap:wrap">
          <div class="field grow" style="min-width:190px">
            <div class="label">4 · How should it happen?</div>
            <div class="row wrap-row" style="gap:7px">
              ${c.modes.map(m => `<button class="chip ${state.mode === m ? "on" : ""}" data-pick-mode="${m}">${m}</button>`).join("")}
            </div>
          </div>
          <div class="kv grow" style="min-width:150px">
            <span class="k">Payable to creator</span>
            <span class="v price" style="font-size:19px">${money(svc.price, c.currency)}</span>
            <span class="xs faint">Kalaa charges the creator a flat 8% platform fee. Clients pay nothing extra.</span>
          </div>
        </div>

        <div class="field">
          <div class="label">5 · Brief (what are we making?)</div>
          <textarea class="textarea" id="bookBrief" placeholder="Dates, deliverables, references, location, number of people…">${esc(state.brief)}</textarea>
        </div>

        <div class="notice">${ico("shield")}
          <div>Your request is not a payment. The creator accepts or declines, and both of you see the status. Cancel any time before the work starts.</div>
        </div>
      </div>`;
  };

  const remount = () => {
    Sheet.setBody(body());
    Sheet.setFoot(`
      <button class="btn" id="bkCancel">Not now</button>
      <button class="btn accent" id="bkSend">${ico("arrow")} Send request</button>`);
    $("#bkCancel").onclick = () => Sheet.close();
    $("#bkSend").onclick = () => {
      const svc = c.services.find(s => s.id === state.serviceId);
      if (!state.date || !state.slot) { toast("Pick a day and a time slot first", "bad"); return; }
      const u = currentUser();
      const b = {
        id: uid("bk"), code: "KB-" + Math.floor(2000 + Math.random() * 8000),
        creatorId: c.id, clientId: u.id, serviceId: svc.id, serviceTitle: svc.title,
        category: svc.category, price: svc.price, currency: c.currency,
        date: state.date, slot: state.slot, mode: state.mode,
        brief: ($("#bookBrief") || {}).value || "", status: "requested",
        createdAt: nowTs(), updatedAt: nowTs(),
        history: [{ status: "requested", at: nowTs(), by: u.name }],
        messages: [], reviewId: null
      };
      DB.bookings.push(b); saveDB();
      Sheet.close();
      toast("Request sent to " + c.name.split(" ")[0]);
      setTimeout(() => { go("bookings"); renderNotif(); }, 260);
    };
  };

  Sheet.openWith({
    title: "Request a booking",
    sub: `Booking with ${esc(c.name)} · usually answers in ~${c.responseRate >= 95 ? "2" : "6"}h`,
    wide: true,
    onMount: (host) => {
      host.onclick = (e) => {
        const svc = e.target.closest("[data-pick-service]"); if (svc) { state.serviceId = svc.dataset.pickService; remount(); return; }
        const day = e.target.closest("[data-pick-day]"); if (day) {
          state.date = day.dataset.pickDay;
          const open = slotOpenOn(c, state.date).filter(s => !takenSlots(c.id, state.date).includes(s));
          state.slot = open.includes(state.slot) ? state.slot : open[0];
          remount(); return;
        }
        const s2 = e.target.closest("[data-pick-slot]"); if (s2) { state.slot = s2.dataset.pickSlot; remount(); return; }
        const m = e.target.closest("[data-pick-mode]"); if (m) { state.mode = m.dataset.pickMode; remount(); return; }
      };
      host.oninput = (e) => { if (e.target.id === "bookBrief") state.brief = e.target.value; };
    }
  });
  remount();
  $("#sheetBody").__state = state;
}

/* slot click on the profile availability grid */
AFTER.creator = () => {
  const root = $("#stage");
  root.onclick = (e) => {
    const svc = e.target.closest(".svc-head");
    if (svc) { svc.parentElement.classList.toggle("open"); return; }
    const pick = e.target.closest("[data-pickslot]");
    if (pick) {
      const [date, slot] = pick.dataset.pickslot.split("|");
      openBookingSheet(parseHash().param, null, { date, slot });
      return;
    }
    const book = e.target.closest("[data-book]");
    if (book) { openBookingSheet(book.dataset.book, book.dataset.svc || null); return; }
    const share = e.target.closest("[data-share]");
    if (share) {
      const url = location.origin + location.pathname + "#/creator/" + share.dataset.share;
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Profile link copied"));
      else toast("Copy this link: " + url);
      return;
    }
    const rv = e.target.closest("[data-review]");
    if (rv) { openReviewSheet(rv.dataset.review); return; }
    const th = e.target.closest("[data-thread]");
    if (th) { openThread(th.dataset.thread); return; }
  };
};

/* ------------------------------------------------------------- messaging - */
function openThread(bookingId) {
  const b = DB.bookings.find(x => x.id === bookingId);
  if (!b) return;
  const me = currentUser(); if (!me) return;
  const otherId = me.id === b.clientId ? b.creatorId : b.clientId;
  const other = me.id === b.clientId ? creatorOfBooking(b) : clientOfBooking(b);
  if (!other) return;
  b.messages = b.messages || [];

  const paint = () => {
    Sheet.setBody(`
      <div class="col" style="gap:14px">
        <div class="row" style="gap:12px">
          ${avatarHTML(other.name, 40, other.id)}
          <div class="grow">
            <div style="font-weight:600;font-size:14px">${esc(other.name)}</div>
            <div class="xs muted">Re: ${esc(b.serviceTitle)} · ${esc(b.code)}</div>
          </div>
          <span class="status ${b.status}">${statusIcon(b.status)} ${b.status}</span>
        </div>
        <div class="divider" style="margin:4px 0"></div>
        <div class="col" style="gap:10px" id="msgList">
          ${b.messages.length ? b.messages.map(m => {
            const mine = m.by === me.id;
            return `<div style="align-self:${mine ? "flex-end" : "flex-start"};max-width:82%">
              <div style="padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;background:${mine ? "var(--ink)" : "var(--surface-2)"};color:${mine ? "var(--bg)" : "var(--ink-soft)"}">${esc(m.text)}</div>
              <div class="xs faint" style="text-align:${mine ? "right" : "left"};margin-top:3px">${timeAgo(m.at)}</div>
            </div>`;
          }).join("") : `<div class="xs faint center" style="padding:14px">No messages yet. Ask about timings, deliverables or references.</div>`}
        </div>
      </div>`);
    Sheet.setFoot(`
      <div class="row grow" style="gap:8px;width:100%">
        <input class="input grow" id="msgInput" placeholder="Write a message…">
        <button class="btn accent" id="msgSend">${ico("arrow")}</button>
      </div>`);
    const send = () => {
      const val = $("#msgInput").value.trim(); if (!val) return;
      b.messages.push({ id: uid("m"), by: me.id, text: val, at: nowTs() });
      b.updatedAt = nowTs();
      if (isCreator() && b.status === "requested") { /* creator replying doesn't auto-accept */ }
      saveDB(); paint();
      $("#msgInput").focus();
      renderNotif();
    };
    $("#msgSend").onclick = send;
    $("#msgInput").onkeydown = (e) => { if (e.key === "Enter") send(); };
  };

  Sheet.openWith({ title: "Messages", sub: esc(b.serviceTitle), onMount: paint });
  paint();
}

/* --------------------------------------------------------- status helpers - */
const STATUS_META = {
  requested: { label: "Requested", icon: "clock" },
  accepted:  { label: "Accepted", icon: "check" },
  declined:  { label: "Declined", icon: "x" },
  completed: { label: "Completed", icon: "spark" },
  cancelled: { label: "Cancelled", icon: "x" }
};
const statusIcon = (s) => ico((STATUS_META[s] || {}).icon || "clock");

function timelineHTML(b) {
  return `<div class="tl">
    ${b.history.map((h, i) => `
      <div class="tl-item">
        <span class="tl-dot ${h.status === "accepted" || h.status === "completed" ? "on" : h.status === "declined" || h.status === "cancelled" ? "bad" : ""}">${h.status === "requested" ? "" : ico(statusIcon2(h.status))}</span>
        <div class="small" style="font-weight:500">${esc(STATUS_META[h.status] ? STATUS_META[h.status].label : h.status)}</div>
        <div class="tl-time">${prettyDateTime(h.at)} · ${esc(h.by || "system")}${h.note ? " · " + esc(h.note) : ""}</div>
      </div>`).join("")}
  </div>`;
}
function statusIcon2(s) { return { requested: "clock", accepted: "check", declined: "x", completed: "spark", cancelled: "x" }[s] || "clock"; }
</script>
<script>
/* ============================================================================
   Layer 5: bookings workspace (accept / decline / complete / cancel),
   review submission, review hub, leaderboards
   ========================================================================== */

/* ---------------------------------------------------------- bookings ----- */
function myBookings(scope) {
  const u = currentUser(); if (!u) return [];
  const cr = isCreator() ? myCreator() : null;
  let list = scope === "sent"
    ? DB.bookings.filter(b => b.clientId === u.id)
    : cr ? DB.bookings.filter(b => b.creatorId === cr.id)
         : DB.bookings.filter(b => b.clientId === u.id);
  return list.sort((a, b) => (statusRank(a) - statusRank(b)) || (b.updatedAt - a.updatedAt));
}
const statusRank = (b) => b.status === "requested" ? 0 : b.status === "accepted" ? 1 : b.status === "completed" ? 3 : 2;

function bookingCardHTML(b, scope) {
  const cr = creatorOfBooking(b), cu = clientOfBooking(b);
  if (!cr || !cu) return "";
  const iAmCreator = isCreator() && myCreator() && myCreator().id === cr.id;
  const other = iAmCreator ? cu : cr;
  const otherSub = iAmCreator ? (cu.company ? cu.company : "Client") : cr.category;
  const canAccept = iAmCreator && b.status === "requested";
  const canComplete = iAmCreator && b.status === "accepted";
  const canReview = !iAmCreator && b.status === "completed" && !b.reviewId && b.clientId === (currentUser() || {}).id;
  const canCancel = b.status === "requested" && !iAmCreator;
  const myReview = b.reviewId ? DB.reviews.find(r => r.id === b.reviewId) : null;

  return `
  <article class="card booking stagger" style="--i:0">
    <div class="bk-top">
      ${avatarHTML(other.name, 52, other.id)}
      <div class="grow" style="min-width:0">
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <span style="font-weight:600">${esc(other.name)}</span>
          <span class="tag ${catColor(b.category)}">${esc(b.category)}</span>
          ${iAmCreator ? "" : `<span class="xs faint">${esc(cr.city)}</span>`}
        </div>
        <div class="small muted truncate" style="margin-top:3px">${esc(b.serviceTitle)}</div>
        <div class="xs faint" style="margin-top:2px">${otherSub} · ref ${esc(b.code)}</div>
      </div>
      <span class="status ${b.status}">${statusIcon(b.status)} ${STATUS_META[b.status].label}</span>
    </div>

    <div class="row wrap-row" style="gap:8px">
      <span class="tag">${ico("cal")} ${prettyDate(b.date)}</span>
      <span class="tag">${ico("clock")} ${esc(b.slot)}</span>
      <span class="tag">${ico("globe")} ${esc(b.mode)}</span>
      <span class="tag">${money(b.price, b.currency)}</span>
    </div>

    ${b.brief ? `<div class="notice" style="align-items:flex-start">${ico("quote")}<div>${esc(b.brief)}</div></div>` : ""}
    ${b.declineNote ? `<div class="notice" style="background:var(--clay-soft);border-color:transparent">${ico("x")}<div><strong style="color:var(--clay)">Declined:</strong> ${esc(b.declineNote)}</div></div>` : ""}
    ${myReview ? `<div class="notice" style="background:var(--sage-soft);border-color:transparent">${ico("star")}
        <div><strong>You rated this ${myReview.rating}/5</strong>${myReview.text ? ` — “${esc(myReview.text)}”` : ""}</div></div>` : ""}

    <details>
      <summary class="small muted" style="cursor:pointer;list-style:none">${ico("clock")} Status timeline</summary>
      <div style="margin-top:12px">${timelineHTML(b)}</div>
    </details>

    <div class="bk-actions">
      ${canAccept ? `<button class="btn accent sm" data-act="accept" data-id="${b.id}">${ico("check")} Accept request</button>` : ""}
      ${canAccept ? `<button class="btn danger sm" data-act="decline" data-id="${b.id}">${ico("x")} Decline</button>` : ""}
      ${canComplete ? `<button class="btn primary sm" data-act="complete" data-id="${b.id}">${ico("spark")} Mark as completed</button>` : ""}
      ${b.status === "accepted" ? `<button class="btn sm" data-thread="${b.id}">${ico("msg")} Message${(b.messages || []).length ? ` (${b.messages.length})` : ""}</button>` : ""}
      ${b.status === "requested" && iAmCreator ? `<button class="btn sm" data-thread="${b.id}">${ico("msg")} Ask a question</button>` : ""}
      ${canReview ? `<button class="btn accent sm" data-review="${b.id}">${ico("star")} Leave a review</button>` : ""}
      ${canCancel ? `<button class="btn danger sm" data-act="cancel" data-id="${b.id}">${ico("x")} Cancel request</button>` : ""}
      ${!iAmCreator && b.status === "completed" && b.reviewId ? `<span class="xs faint" style="align-self:center">Review posted · thanks</span>` : ""}
      ${iAmCreator && b.status === "accepted" ? `<button class="btn ghost sm" data-act="cancel" data-id="${b.id}">${ico("x")} Cancel booking</button>` : ""}
    </div>
  </article>`;
}

VIEWS.bookings = () => {
  const u = currentUser(); if (!u) return "";
  const creator = isCreator() ? myCreator() : null;
  if (isCreator() && !creator) return `<section class="wrap" style="padding:60px 0"><div class="empty">${ico("layers")}<div>Finish setting up your creator profile to receive bookings.</div><button class="btn accent" data-go="edit">Set up profile</button></div></section>`;
  const scope = isCreator() ? (UI.bkScope || "received") : "sent";

  return `
  <section class="wrap" id="bkRoot" style="padding-top:30px" data-scope="${scope}">
    <div class="sec-head" style="margin-bottom:16px">
      <div>
        <div class="sec-eyebrow">${isCreator() ? "Creator side" : "Client side"}</div>
        <h1 style="font-size:clamp(26px,3.2vw,38px)">${isCreator() ? scope === "sent" ? "Requests you sent" : "Booking requests" : "Your bookings"}</h1>
      </div>
      <div class="row wrap-row" style="gap:8px">
        ${isCreator() ? `<div class="tabs" id="bkScopeTabs">
          <button class="tab ${scope === "received" ? "on" : ""}" data-scope="received">Received</button>
          <button class="tab ${scope === "sent" ? "on" : ""}" data-scope="sent">Sent</button>
          <span class="tab-glider" style="width:0"></span>
        </div>` : `<button class="btn primary" data-go="discover">${ico("search")} Find a creator</button>`}
      </div>
    </div>
    <div id="bkSummary" class="grid g-3" style="margin-bottom:20px"></div>
    <div id="bkList" class="grid g-2"></div>
  </section>`;
};

function paintBookings() {
  const root = $("#bkRoot"); if (!root) return;
  const scope = root.dataset.scope || "received";
  const list = myBookings(scope);
  const iAmCreator = isCreator() && myCreator();
  const pending = list.filter(b => b.status === "requested").length;
  const upcoming = list.filter(b => b.status === "accepted").length;
  const done = list.filter(b => b.status === "completed").length;
  const value = sum(list.filter(b => b.status === "accepted" || b.status === "completed").map(b => b.price));

  $("#bkSummary").innerHTML = [
    [pending, iAmCreator ? "Requests awaiting your decision" : "Requests awaiting a reply"],
    [upcoming, "Confirmed & upcoming"],
    [done, "Completed"],
    [money(value), iAmCreator ? "Value of confirmed work" : "Confirmed spend"]
  ].map(([n, l], i) => `<div class="card pad stagger" style="--i:${i}"><div class="stat-num">${n}</div><div class="xs muted mt-6">${l}</div></div>`).join("");

  $("#bkList").innerHTML = list.length
    ? list.map(b => bookingCardHTML(b, scope)).join("")
    : `<div class="card" style="grid-column:1/-1"><div class="empty">${ico("briefcase")}
        <div><div style="font-weight:600;color:var(--ink)">Nothing here yet</div>
        <div class="small">${iAmCreator ? "Requests from clients will land here, newest first." : "Browse creators and send your first booking request."}</div></div>
        ${iAmCreator ? "" : `<button class="btn accent sm" data-go="discover">Browse creators</button>`}
      </div></div>`;
}

function setBookingStatus(id, status, note) {
  const b = DB.bookings.find(x => x.id === id); if (!b) return;
  const u = currentUser();
  b.status = status; b.updatedAt = nowTs();
  if (note) b.declineNote = note;
  b.history.push({ status, at: nowTs(), by: u.name, note });
  if (status === "accepted") {
    const cr = creatorOfBooking(b);
    if (cr) cr.bookedTotal = (cr.bookedTotal || 0) + 1;
  }
  saveDB();
}

AFTER.bookings = () => {
  const root = $("#bkRoot"); if (!root) return;
  paintBookings();

  const scopeTabs = $("#bkScopeTabs");
  if (scopeTabs) {
    const glider = $(".tab-glider", scopeTabs);
    const place = () => {
      const on = $(".tab.on", scopeTabs); if (!on || !glider) return;
      glider.style.width = on.offsetWidth + "px";
      glider.style.transform = `translateX(${on.offsetLeft - 4}px)`;
    };
    requestAnimationFrame(place);
    scopeTabs.onclick = (e) => {
      const t = e.target.closest("[data-scope]"); if (!t) return;
      $$(".tab", scopeTabs).forEach(x => x.classList.toggle("on", x === t));
      UI.bkScope = t.dataset.scope;
      root.dataset.scope = t.dataset.scope;
      place(); paintBookings();
    };
  }

  root.onclick = (e) => {
    const th = e.target.closest("[data-thread]"); if (th) { openThread(th.dataset.thread); return; }
    const rv = e.target.closest("[data-review]"); if (rv) { openReviewSheet(rv.dataset.review); return; }
    const act = e.target.closest("[data-act]"); if (!act) return;
    const id = act.dataset.id, kind = act.dataset.act;

    if (kind === "accept") {
      setBookingStatus(id, "accepted");
      const b = DB.bookings.find(x => x.id === id);
      toast("Accepted — " + prettyDate(b.date) + " is now blocked in your calendar");
      paintBookings(); renderNotif(); return;
    }
    if (kind === "complete") {
      setBookingStatus(id, "completed");
      toast("Marked complete — the client can now leave a review");
      paintBookings(); renderNotif(); return;
    }
    if (kind === "cancel") {
      if (!confirm("Cancel this booking? Both sides will see it as cancelled.")) return;
      setBookingStatus(id, "cancelled");
      toast("Booking cancelled"); paintBookings(); renderNotif(); return;
    }
    if (kind === "decline") {
      Sheet.openWith({
        title: "Decline this request",
        sub: "A short note goes a long way — the client sees it instantly.",
        body: `<div class="field"><div class="label">Reason (optional but kind)</div>
          <textarea class="textarea" id="declineNote" placeholder="e.g. Already booked that week — do send a request for the following month."></textarea></div>
          <div class="row wrap-row" style="gap:6px;margin-top:12px">
            ${["Already booked", "Outside my category", "Budget too low", "Travel too far"].map(t => `<button class="chip" data-quick="${esc(t)}">${t}</button>`).join("")}
          </div>`,
        foot: `<button class="btn" id="decNo">Keep it</button><button class="btn danger" id="decYes">Decline request</button>`,
        onMount: (body, foot) => {
          body.onclick = (e) => { const q = e.target.closest("[data-quick]"); if (q) $("#declineNote").value = q.dataset.quick; };
          $("#decYes").onclick = () => {
            setBookingStatus(id, "declined", $("#declineNote").value.trim());
            Sheet.close(); toast("Request declined"); paintBookings(); renderNotif();
          };
          $("#decNo").onclick = () => Sheet.close();
        }
      });
    }
  };
};

/* ---------------------------------------------------- review submission -- */
function openReviewSheet(bookingId) {
  const b = DB.bookings.find(x => x.id === bookingId); if (!b) return;
  const cr = creatorOfBooking(b); if (!cr) return;
  const u = currentUser();
  if (!u) { toast("Sign in to review", "bad"); return; }
  if (b.clientId !== u.id) { toast("Only the client on this booking can review it", "bad"); return; }
  if (b.status !== "completed") { toast("Reviews unlock once the booking is completed", "bad"); return; }

  const state = { rating: 0, tags: [], text: "" };
  const body = () => `
    <div class="col" style="gap:20px">
      <div class="row" style="gap:13px">
        ${avatarHTML(cr.name, 52, cr.id)}
        <div class="grow">
          <div style="font-weight:600">${esc(cr.name)}</div>
          <div class="xs muted">${esc(b.serviceTitle)} · ${prettyDate(b.date)}</div>
        </div>
        <span class="status completed">${ico("check")} Completed</span>
      </div>

      <div class="field">
        <div class="label">Your rating — this feeds the weekly &amp; monthly leaderboards</div>
        <div class="rate-picker" id="ratePicker">
          ${[1, 2, 3, 4, 5].map(i => `<button class="rate-star ${state.rating >= i ? "lit" : ""}" data-rate="${i}" aria-label="${i} stars">${ico("star")}</button>`).join("")}
          <span class="small muted" style="margin-left:8px" id="rateLabel">${state.rating ? state.rating + " / 5" : "Tap to rate"}</span>
        </div>
        <div class="xs faint">Points awarded to the creator = stars you give (max 5 per review).</div>
      </div>

      <div class="field">
        <div class="label">What stood out? (optional)</div>
        <div class="row wrap-row" style="gap:6px">
          ${REVIEW_TAGS.map(t => `<button class="chip ${state.tags.includes(t) ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}
        </div>
      </div>

      <div class="field">
        <div class="label">Written review (optional)</div>
        <textarea class="textarea" id="revText" placeholder="What was the work like? Would you book them again?">${esc(state.text)}</textarea>
      </div>

      <div class="notice">${ico("shield")}<div>Reviews are public and tied to a real completed booking — that's what keeps the leaderboard honest.</div></div>
    </div>`;

  const remount = () => {
    Sheet.setBody(body());
    Sheet.setFoot(`<button class="btn" id="revCancel">Later</button><button class="btn accent" id="revSubmit">${ico("star")} Post review</button>`);
    $("#revCancel").onclick = () => Sheet.close();
    $("#revSubmit").onclick = () => {
      if (!state.rating) { toast("Pick a star rating first", "bad"); return; }
      const text = ($("#revText") || {}).value || "";
      const r = {
        id: uid("rv"), creatorId: cr.id, clientId: u.id, bookingId: b.id,
        rating: state.rating, text: text.trim(), tags: state.tags.slice(), createdAt: nowTs()
      };
      DB.reviews.push(r); b.reviewId = r.id; b.updatedAt = nowTs();
      b.history.push({ status: "reviewed", at: nowTs(), by: u.name });
      saveDB();
      Sheet.close();
      toast(`Review posted — ${state.rating} star${state.rating > 1 ? "s" : ""} for ${cr.name.split(" ")[0]}`);
      setTimeout(() => { renderRoute(); renderNotif(); }, 220);
    };
  };

  Sheet.openWith({
    title: "Leave a review", sub: esc(cr.name), wide: true, onMount: () => {
      $("#sheetBody").onclick = (e) => {
        const st = e.target.closest("[data-rate]");
        if (st) { state.rating = Number(st.dataset.rate); remount(); return; }
        const tg = e.target.closest("[data-tag]");
        if (tg) { const t = tg.dataset.tag; state.tags = state.tags.includes(t) ? state.tags.filter(x => x !== t) : state.tags.concat(t); remount(); return; }
      };
      $("#sheetBody").oninput = (e) => { if (e.target.id === "revText") state.text = e.target.value; };
      $("#sheetBody").onmouseover = (e) => {
        const st = e.target.closest("[data-rate]"); if (!st) return;
        const val = Number(st.dataset.rate);
        $$("#ratePicker .rate-star").forEach((el, i) => el.classList.toggle("lit", i < val));
        $("#rateLabel").textContent = val + " / 5";
      };
      $("#sheetBody").onmouseleave = () => {
        $$("#ratePicker .rate-star").forEach((el, i) => el.classList.toggle("lit", i < state.rating));
        const lab = $("#rateLabel"); if (lab) lab.textContent = state.rating ? state.rating + " / 5" : "Tap to rate";
      };
    }
  });
  remount();
}

/* ------------------------------------------------------- client reviews -- */
VIEWS.reviews = () => {
  const u = currentUser(); if (!u) return "";
  const creator = isCreator() ? myCreator() : null;

  if (isCreator() && creator) {
    const mine = reviewsFor(creator.id).sort((a, b) => b.createdAt - a.createdAt);
    const st = allTimeStats(creator.id);
    return `
    <section class="wrap" id="revRoot" style="padding-top:30px">
      <div class="sec-head" style="margin-bottom:16px">
        <div><div class="sec-eyebrow">Client side of the story</div><h1 style="font-size:clamp(26px,3.2vw,38px)">Reviews you've received</h1></div>
        <button class="btn" data-go="leaderboard">${ico("trophy")} See your rank</button>
      </div>
      <div class="grid g-3" style="margin-bottom:20px">
        <div class="card pad"><div class="stat-num">${st.avg ? st.avg.toFixed(2) : "—"}</div><div class="xs muted mt-6">Average across ${st.count} review${st.count === 1 ? "" : "s"}</div></div>
        <div class="card pad"><div class="stat-num">${st.points}</div><div class="xs muted mt-6">Total points earned</div></div>
        <div class="card pad"><div class="stat-num">${reviewsFor(creator.id).filter(r => r.rating === 5).length}</div><div class="xs muted mt-6">Five-star reviews</div></div>
      </div>
      <div class="card pad">
        ${mine.length ? mine.map(r => {
          const cu = findUser(r.clientId) || { name: "Client" };
          return `<div class="review">
            <div class="row" style="gap:11px">
              ${avatarHTML(cu.name, 40, cu.id || cu.name)}
              <div class="grow"><div style="font-weight:600;font-size:14px">${esc(cu.name)}</div><div class="xs faint">${timeAgo(r.createdAt)}</div></div>
              ${starsHTML(r.rating)}
            </div>
            ${r.text ? `<div class="review-q">“${esc(r.text)}”</div>` : ""}
            ${(r.tags || []).length ? `<div class="row wrap-row" style="gap:6px;margin-top:9px">${r.tags.map(t => `<span class="tag sage">${esc(t)}</span>`).join("")}</div>` : ""}
            ${r.reply ? `<div class="notice" style="margin-top:10px">${ico("msg")}<div><strong>Your reply:</strong> ${esc(r.reply)}</div></div>`
              : `<button class="btn ghost sm mt-10" data-reply="${r.id}">${ico("msg")} Reply publicly</button>`}
          </div>`;
        }).join("") : `<div class="empty">${ico("star")}<div>No reviews yet. Complete a booking and your client's review will appear here.</div></div>`}
      </div>
    </section>`;
  }

  // client view
  const mine = DB.reviews.filter(r => r.clientId === u.id).sort((a, b) => b.createdAt - a.createdAt);
  const toReview = DB.bookings.filter(b => b.clientId === u.id && b.status === "completed" && !b.reviewId);
  const recent = DB.reviews.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 8);
  const top = leaderboard(UI.lbWin);

  return `
  <section class="wrap" id="revRoot" style="padding-top:30px">
    <div class="sec-head" style="margin-bottom:16px">
      <div><div class="sec-eyebrow">Your voice</div><h1 style="font-size:clamp(26px,3.2vw,38px)">Reviews &amp; leaderboards</h1></div>
      <button class="btn primary" data-go="discover">${ico("search")} Book someone new</button>
    </div>

    <div class="grid g-side">
      <div class="col" style="gap:18px">
        <div class="card pad">
          <div class="between" style="margin-bottom:10px">
            <div><div class="sec-eyebrow">Awaiting your review</div><h3>${toReview.length}</h3></div>
          </div>
          ${toReview.length ? toReview.map(b => {
            const cr = creatorOfBooking(b);
            return `<div class="lb-row" style="align-items:flex-start;padding:12px 0">
              ${avatarHTML(cr.name, 40, cr.id)}
              <div class="grow" style="min-width:0">
                <div class="small truncate" style="font-weight:600">${esc(cr.name)}</div>
                <div class="xs muted truncate">${esc(b.serviceTitle)} · ${prettyDate(b.date)}</div>
                <button class="btn accent sm mt-6" data-review="${b.id}">${ico("star")} Rate this booking</button>
              </div>
            </div>`;
          }).join("") : `<div class="small muted">Nothing pending. You've reviewed every completed booking — thank you, it genuinely helps the community.</div>`}
        </div>

        <div class="card pad">
          <div class="sec-eyebrow">Reviews you've written</div>
          ${mine.length ? mine.map(r => {
            const cr = findCreator(r.creatorId);
            return `<div class="review">
              <div class="between">
                <div class="row" style="gap:9px">
                  ${avatarHTML(cr.name, 32, cr.id)}
                  <div><div class="small" style="font-weight:600">${esc(cr.name)}</div><div class="xs faint">${timeAgo(r.createdAt)}</div></div>
                </div>
                ${starsHTML(r.rating)}
              </div>
              ${r.text ? `<div class="xs soft" style="margin-top:8px;line-height:1.55">“${esc(r.text)}”</div>` : ""}
            </div>`;
          }).join("") : `<div class="small muted mt-10">You haven't written a review yet. Reviews can only be left after a completed booking.</div>`}
        </div>
      </div>

      <div class="col" style="gap:18px">
        <div class="card pad">
          <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
            <div><div class="sec-eyebrow">Leaderboard</div><h3>${WINDOWS[UI.lbWin].label} · ${UI.lbCat === "all" ? "all fields" : UI.lbCat}</h3></div>
            <div class="row wrap-row" style="gap:8px">
              <div class="tabs">
                ${Object.entries(WINDOWS).map(([k, w]) => `<button class="tab ${UI.lbWin === k ? "on" : ""}" data-lbwin="${k}">${w.label}</button>`).join("")}
              </div>
              <select class="select" style="width:170px" id="lbCatSel">
                <option value="all">All categories</option>
                ${CATEGORIES.map(c => `<option ${UI.lbCat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div id="lbHost">${leaderboardTableHTML(top)}</div>
        </div>

        <div class="card pad">
          <div class="sec-eyebrow">Latest reviews across Kalaa</div>
          <div class="col" style="gap:0;margin-top:6px" id="feedHost">
            ${recent.map(r => {
              const cr = findCreator(r.creatorId), cu = findUser(r.clientId) || { name: "Client" };
              return `<div class="review">
                <div class="row" style="gap:10px">
                  ${avatarHTML(cr.name, 32, cr.id)}
                  <div class="grow">
                    <div class="small"><strong>${esc(cu.name)}</strong> reviewed <strong>${esc(cr.name)}</strong></div>
                    <div class="xs faint">${timeAgo(r.createdAt)} · ${esc(cr.category)}</div>
                  </div>
                  ${starsHTML(r.rating)}
                </div>
                ${r.text ? `<div class="xs soft" style="margin-top:7px">“${esc(r.text)}”</div>` : ""}
              </div>`;
            }).join("")}
          </div>
        </div>
      </div>
    </div>
  </section>`;
};

function leaderboardTableHTML(rows, opts = {}) {
  if (!rows.length) return `<div class="empty">${ico("trophy")}<div>No reviews in this window yet.</div></div>`;
  const max = rows[0].points || 1;
  return `<div class="col" style="gap:4px">
    ${rows.map((r, i) => `
      <div class="lb-row" style="cursor:pointer" data-open="${r.creator.id}">
        <span class="lb-rank">${i + 1}</span>
        ${avatarHTML(r.creator.name, 40, r.creator.id)}
        <div class="grow" style="min-width:0">
          <div class="row" style="gap:6px">
            <span class="small" style="font-weight:600">${esc(r.creator.name)}</span>
            ${r.creator.verified ? `<span class="verified">${ico("badge")}</span>` : ""}
            ${opts.highlight && opts.highlight === r.creator.id ? `<span class="tag sage">you</span>` : ""}
          </div>
          <div class="xs muted truncate">${esc(r.creator.category)} · ${esc(r.creator.city)}</div>
          <div class="bar mt-6" style="max-width:190px"><i style="width:${(r.points / max) * 100}%"></i></div>
        </div>
        <div class="lb-metrics">
          <div class="hide-sm"><div class="small mono" style="font-weight:600">${r.count}</div><div class="xs faint">reviews</div></div>
          <div><div class="row" style="gap:5px;justify-content:flex-end">${starsHTML(r.avg)}<span class="small mono" style="font-weight:600">${r.avg.toFixed(1)}</span></div>
          <div class="xs faint">${r.points} pts in window</div></div>
        </div>
      </div>`).join("")}
  </div>`;
}

/* --------------------------------------------------------- leaderboard --- */
VIEWS.leaderboard = () => {
  const rows = leaderboard(UI.lbWin, UI.lbCat);
  const creator = isCreator() ? myCreator() : null;
  const myRank = creator ? rows.findIndex(r => r.creator.id === creator.id) + 1 : 0;
  return `
  <section class="wrap" id="lbRoot" style="padding-top:30px">
    <div class="sec-head" style="margin-bottom:16px">
      <div>
        <div class="sec-eyebrow">Points earned from client reviews</div>
        <h1 style="font-size:clamp(26px,3.2vw,38px)">Leaderboard</h1>
        <p class="muted small" style="margin-top:8px;max-width:64ch">
          Every verified review carries up to 5 points. Creators are ranked by average stars inside the
          window, with review volume as the tie-breaker. ${WINDOWS[UI.lbWin].blurb}.
        </p>
      </div>
      <div class="row wrap-row" style="gap:8px">
        <div class="tabs">
          ${Object.entries(WINDOWS).map(([k, w]) => `<button class="tab ${UI.lbWin === k ? "on" : ""}" data-lbwin="${k}">${w.label}</button>`).join("")}
        </div>
        <select class="select" style="width:180px" id="lbCatSel">
          <option value="all">All categories</option>
          ${CATEGORIES.map(c => `<option ${UI.lbCat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="grid g-3 mb-16">
      <div class="card pad"><div class="stat-num">${rows.length}</div><div class="xs muted mt-6">creators with reviews in ${WINDOWS[UI.lbWin].label.toLowerCase()}</div></div>
      <div class="card pad"><div class="stat-num">${rows.length ? rows[0].points : 0}</div><div class="xs muted mt-6">points by the leader${rows.length ? " — " + esc(rows[0].creator.name) : ""}</div></div>
      <div class="card pad">
        <div class="stat-num">${creator ? (myRank ? "#" + myRank : "—") : DB.reviews.length}</div>
        <div class="xs muted mt-6">${creator ? "your position this window" : "total reviews posted on Kalaa"}</div>
      </div>
    </div>

    ${podiumHTML(rows)}

    <div class="card pad mt-24">
      <div class="between" style="margin-bottom:12px">
        <div><div class="sec-eyebrow">Full ranking</div><h3>${WINDOWS[UI.lbWin].label}${UI.lbCat === "all" ? "" : " · " + esc(UI.lbCat)}</h3></div>
        <span class="xs faint">Avg stars · review count · points</span>
      </div>
      <div id="lbHost">${leaderboardTableHTML(rows, { highlight: creator ? creator.id : null })}</div>
    </div>
  </section>`;
};

AFTER.leaderboard = () => {
  const root = $("#lbRoot"); if (!root) return;
  root.onclick = (e) => {
    const w = e.target.closest("[data-lbwin]");
    if (w) { UI.lbWin = w.dataset.lbwin; renderRoute(); return; }
    const open = e.target.closest("[data-open]");
    if (open) go("creator", open.dataset.open);
  };
  const sel = $("#lbCatSel");
  if (sel) sel.onchange = () => { UI.lbCat = sel.value; renderRoute(); };
};

AFTER.reviews = () => {
  const root = $("#revRoot"); if (!root) return;
  root.onclick = (e) => {
    const rv = e.target.closest("[data-review]"); if (rv) { openReviewSheet(rv.dataset.review); return; }
    const w = e.target.closest("[data-lbwin]");
    if (w) { UI.lbWin = w.dataset.lbwin; renderRoute(); return; }
    const rep = e.target.closest("[data-reply]"); if (rep) { openReplySheet(rep.dataset.reply); return; }
    const open = e.target.closest("[data-open]"); if (open) { go("creator", open.dataset.open); return; }
  };
  const sel = $("#lbCatSel");
  if (sel) sel.onchange = () => { UI.lbCat = sel.value; renderRoute(); };
};

/* creator public reply to a review */
function openReplySheet(reviewId) {
  const r = DB.reviews.find(x => x.id === reviewId); if (!r) return;
  const cr = findCreator(r.creatorId);
  Sheet.openWith({
    title: "Reply publicly", sub: "Your reply appears under the review on your profile.",
    body: `<div class="field"><div class="label">Reply to ${esc((findUser(r.clientId) || {}).name || "client")}</div>
      <textarea class="textarea" id="replyText" placeholder="Thank them, or add context in a calm, professional tone."></textarea></div>`,
    foot: `<button class="btn" id="repCancel">Cancel</button><button class="btn accent" id="repSend">Post reply</button>`,
    onMount: () => {
      $("#repCancel").onclick = () => Sheet.close();
      $("#repSend").onclick = () => {
        const v = $("#replyText").value.trim(); if (!v) { toast("Write something first", "bad"); return; }
        r.reply = v; r.replyAt = nowTs(); saveDB();
        Sheet.close(); toast("Reply posted"); renderRoute();
      };
    }
  });
}
</script>
<script>
/* ============================================================================
   Layer 6: creator studio (services, availability, incoming work),
   account, profile editor, auth, boot
   ========================================================================== */

/* ------------------------------------------------------------- studio ---- */
VIEWS.studio = () => {
  const c = myCreator();
  if (!c) return "";
  const st = allTimeStats(c.id);
  const all = bookingsFor(c.id);
  const pending = all.filter(b => b.status === "requested");
  const upcoming = all.filter(b => b.status === "accepted").sort((a, b) => a.date.localeCompare(b.date));
  const weekStats = ratingStats(c.id, weekStartTs());
  const weekRank = leaderboard("week").findIndex(r => r.creator.id === c.id) + 1;
  const monthRank = leaderboard("month").findIndex(r => r.creator.id === c.id) + 1;
  const next14 = bookableDays(c, 14);
  const u = currentUser();

  return `
  <section class="wrap" id="studioRoot" style="padding-top:30px">
    <div class="card" style="padding:22px;margin-bottom:20px">
      <div class="row wrap-row between" style="gap:16px">
        <div class="row" style="gap:14px">
          ${avatarHTML(c.name, 72, c.id)}
          <div>
            <h2 style="display:flex;align-items:center;gap:8px">${esc(c.name)} ${c.verified ? `<span class="verified">${ico("badge")}</span>` : ""}</h2>
            <div class="small muted">${esc(c.headline)}</div>
            <div class="row wrap-row" style="gap:8px;margin-top:8px">
              <span class="tag ${catColor(c.category)}">${esc(c.category)}</span>
              <span class="tag">${ico("pin")} ${esc(c.city)}</span>
              <span class="tag">${esc(c.services.length)} services live</span>
              <span class="tag ${pending.length ? "clay" : "sage"}">${pending.length} awaiting you</span>
            </div>
          </div>
        </div>
        <div class="row wrap-row" style="gap:9px">
          <button class="btn" data-go="creator/${c.id}">${ico("user")} View public profile</button>
          <button class="btn primary" data-go="edit">${ico("edit")} Edit profile</button>
        </div>
      </div>
    </div>

    <div class="grid g-3" style="margin-bottom:20px">
      ${[
        [st.count ? st.avg.toFixed(2) : "—", `Average rating from ${st.count} reviews`],
        [st.points, "Lifetime points from clients"],
        [weekStats.points, `Points this week (${WINDOWS.week.label.toLowerCase()})`],
        [upcoming.length, "Confirmed & upcoming"],
        [weekRank ? "#" + weekRank : "—", "Weekly leaderboard position"],
        [monthRank ? "#" + monthRank : "—", "Monthly leaderboard position"]
      ].map(([n, l], i) => `<div class="card pad stagger" style="--i:${i}"><div class="stat-num">${n}</div><div class="xs muted mt-6">${l}</div></div>`).join("")}
    </div>

    <div class="grid g-side">
      <div class="col" style="gap:18px">
        <div class="card pad">
          <div class="between" style="margin-bottom:12px">
            <div><div class="sec-eyebrow">Your week</div><h3>Working pattern</h3></div>
            <button class="btn sm accent" id="saveAvail">${ico("check")} Save</button>
          </div>
          <div class="label">Days you take work</div>
          <div class="row wrap-row" style="gap:5px;margin-bottom:14px">
            ${[1, 2, 3, 4, 5, 6, 0].map(d => `<button class="chip ${c.availability.days.includes(d) ? "on" : ""}" data-avday="${d}">${WDF[d].slice(0, 3)}</button>`).join("")}
          </div>
          <div class="label">Slots you open</div>
          <div class="row wrap-row" style="gap:5px;margin-bottom:14px">
            ${SLOTS.map(s => `<button class="chip ${c.availability.slots[s] ? "on" : ""}" data-avslot="${s}">${esc(s)}</button>`).join("")}
          </div>
          <div class="field" style="margin-bottom:14px">
            <div class="label">Minimum notice</div>
            <select class="select" id="leadSel">
              ${[0, 1, 2, 3, 5, 7].map(n => `<option value="${n}" ${c.availability.leadDays === n ? "selected" : ""}>${n === 0 ? "Same day requests welcome" : n + " day" + (n > 1 ? "s" : "") + " notice"}</option>`).join("")}
            </select>
          </div>
          <div class="label">Block specific dates</div>
          <div class="row" style="gap:8px">
            <input type="date" class="input" id="blockDate">
            <button class="btn sm" id="addBlock">${ico("plus")} Block</button>
          </div>
          <div class="row wrap-row" style="gap:6px;margin-top:10px">
            ${c.availability.blocked.length ? c.availability.blocked.sort().map(d => `<span class="chip" data-unblock="${d}">${prettyDate(d)} ${ico("x")}</span>`).join("")
              : `<span class="xs faint">No blocked dates. Blocking a date hides it from booking instantly.</span>`}
          </div>
        </div>

        <div class="card pad">
          <div class="sec-eyebrow">Next 14 days</div>
          <div class="col" style="gap:8px;margin-top:8px">
            ${next14.map(d => {
              const dd = new Date(d.date + "T00:00:00");
              const taken = takenSlots(c.id, d.date);
              const busyAll = d.open.length === 0 && taken.length > 0;
              return `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
                <div class="row" style="gap:10px">
                  <span class="small" style="width:74px;font-weight:500">${WD[dd.getDay()]} ${dd.getDate()} ${MONTHS[dd.getMonth()]}</span>
                  <span class="xs muted">${!c.availability.days.includes(dd.getDay()) ? "not working" : taken.length ? taken.map(t => t + " booked").join(", ") : "open"}</span>
                </div>
                <div class="avail-dots">
                  ${SLOTS.map(s => {
                    const open = d.open.includes(s) && !taken.includes(s);
                    const isTaken = taken.includes(s);
                    return `<span class="adot ${open ? "on" : ""}" style="${isTaken ? "background:var(--clay)" : ""}" title="${s}${isTaken ? " · booked" : open ? " · free" : " · closed"}"></span>`;
                  }).join("")}
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>
      </div>

      <div class="col" style="gap:18px">
        ${pending.length ? `
        <div class="card pad">
          <div class="between" style="margin-bottom:12px">
            <div><div class="sec-eyebrow">Needs your answer</div><h3>${pending.length} open request${pending.length > 1 ? "s" : ""}</h3></div>
            <button class="btn sm" data-go="bookings">Open bookings</button>
          </div>
          <div class="col" style="gap:10px">
            ${pending.map(b => {
              const cu = clientOfBooking(b);
              return `<div class="card pad" style="box-shadow:none;background:var(--surface-2)">
                <div class="row" style="gap:12px;align-items:flex-start">
                  ${avatarHTML(cu.name, 40, cu.id)}
                  <div class="grow" style="min-width:0">
                    <div class="small" style="font-weight:600">${esc(cu.name)}${cu.company ? ` · <span class="muted">${esc(cu.company)}</span>` : ""}</div>
                    <div class="xs muted truncate">${esc(b.serviceTitle)}</div>
                    <div class="row wrap-row" style="gap:6px;margin-top:8px">
                      <span class="tag">${ico("cal")} ${prettyDate(b.date)}</span>
                      <span class="tag">${esc(b.slot)}</span>
                      <span class="tag">${money(b.price, b.currency)}</span>
                    </div>
                    ${b.brief ? `<div class="xs soft" style="margin-top:9px;line-height:1.5">“${esc(b.brief)}”</div>` : ""}
                    <div class="row wrap-row" style="gap:8px;margin-top:11px">
                      <button class="btn accent sm" data-act="accept" data-id="${b.id}">${ico("check")} Accept</button>
                      <button class="btn danger sm" data-act="decline" data-id="${b.id}">${ico("x")} Decline</button>
                      <button class="btn ghost sm" data-thread="${b.id}">${ico("msg")} Message</button>
                    </div>
                  </div>
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>` : ""}

        <div class="card pad">
          <div class="between" style="margin-bottom:12px">
            <div><div class="sec-eyebrow">Catalogue</div><h3>${c.services.length} services live</h3></div>
            <button class="btn sm" id="addService">${ico("plus")} Add service</button>
          </div>
          <div class="col" style="gap:9px">
            ${c.services.map(s => `
              <div class="svc-line" style="padding:12px 13px">
                <div class="grow" style="min-width:0">
                  <div class="small truncate" style="font-weight:600">${esc(s.title)}</div>
                  <div class="row" style="gap:7px;margin-top:3px;flex-wrap:wrap">
                    <span class="tag ${catColor(s.category)}">${esc(s.category)}</span>
                    <span class="xs muted">${money(s.price, c.currency)} / ${esc(s.unit)}</span>
                  </div>
                </div>
                <button class="iconbtn" data-editsvc="${s.id}" title="Edit">${ico("edit")}</button>
                <button class="iconbtn" data-delsvc="${s.id}" title="Remove">${ico("trash")}</button>
              </div>`).join("")}
          </div>
          <div class="xs faint mt-10">Changes are live on your profile the moment you save — clients see updated prices instantly.</div>
        </div>

        <div class="card pad">
          <div class="sec-eyebrow">Confirmed schedule</div>
          ${upcoming.length ? `<div class="col" style="gap:10px;margin-top:8px">
            ${upcoming.map(b => {
              const cu = clientOfBooking(b);
              return `<div class="row between" style="gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)">
                <div class="row" style="gap:11px;min-width:0">
                  ${avatarHTML(cu.name, 32, cu.id)}
                  <div style="min-width:0">
                    <div class="small truncate" style="font-weight:500">${esc(b.serviceTitle)}</div>
                    <div class="xs muted">${esc(cu.name)} · ${prettyDate(b.date)} · ${esc(b.slot)}</div>
                  </div>
                </div>
                <div class="row" style="gap:6px">
                  <span class="xs mono">${money(b.price, b.currency)}</span>
                  <button class="btn ghost sm" data-thread="${b.id}">${ico("msg")}</button>
                </div>
              </div>`;
            }).join("")}
          </div>` : `<div class="small muted mt-10">No confirmed work on the calendar yet.</div>`}
        </div>

        <div class="card pad">
          <div class="sec-eyebrow">Performance</div>
          <div class="col" style="gap:12px;margin-top:8px">
            ${[["Requests answered", c.responseRate + "%"],
               ["Bookings completed here", all.filter(b => b.status === "completed").length],
               ["Total booked on Kalaa", c.bookedTotal],
               ["Reviews received", st.count],
               ["5-star share", st.count ? Math.round((st.dist[4] / st.count) * 100) + "%" : "—"]].map(([k, v]) => `
              <div class="between"><span class="small muted">${k}</span><span class="small" style="font-weight:600">${v}</span></div>`).join("")}
          </div>
          <div class="divider"></div>
          <div class="xs faint">Signed in as ${esc(u.email)} · creator account</div>
        </div>
      </div>
    </div>
  </section>`;
};

AFTER.studio = () => {
  const root = $("#studioRoot"); if (!root) return;
  const c = myCreator(); if (!c) return;

  root.onclick = (e) => {
    const day = e.target.closest("[data-avday]");
    if (day) {
      const d = Number(day.dataset.avday);
      c.availability.days = c.availability.days.includes(d) ? c.availability.days.filter(x => x !== d) : c.availability.days.concat(d);
      saveDB(); renderRoute(); return;
    }
    const slot = e.target.closest("[data-avslot]");
    if (slot) {
      const s = slot.dataset.avslot;
      c.availability.slots[s] = !c.availability.slots[s];
      if (!SLOTS.some(x => c.availability.slots[x])) c.availability.slots[s] = true;
      saveDB(); renderRoute(); return;
    }
    const blk = e.target.closest("[data-unblock]");
    if (blk) { c.availability.blocked = c.availability.blocked.filter(x => x !== blk.dataset.unblock); saveDB(); renderRoute(); toast("Date unblocked"); return; }
    if (e.target.closest("#addBlock")) {
      const v = $("#blockDate").value;
      if (!v) { toast("Pick a date to block", "bad"); return; }
      if (!c.availability.blocked.includes(v)) c.availability.blocked.push(v);
      saveDB(); renderRoute(); toast(prettyDate(v) + " blocked"); return;
    }
    if (e.target.closest("#saveAvail")) {
      const lead = Number($("#leadSel").value);
      c.availability.leadDays = lead; saveDB();
      toast("Availability saved — clients see your new pattern now"); return;
    }
    if (e.target.closest("#addService")) { openServiceSheet(null); return; }
    const ed = e.target.closest("[data-editsvc]"); if (ed) { openServiceSheet(ed.dataset.editsvc); return; }
    const del = e.target.closest("[data-delsvc]");
    if (del) {
      if (c.services.length <= 1) { toast("Keep at least one service on your profile", "bad"); return; }
      if (!confirm("Remove this service from your profile?")) return;
      c.services = c.services.filter(s => s.id !== del.dataset.delsvc);
      saveDB(); renderRoute(); toast("Service removed"); return;
    }
    const act = e.target.closest("[data-act]");
    if (act) {
      const id = act.dataset.id;
      if (act.dataset.act === "accept") { setBookingStatus(id, "accepted"); toast("Accepted"); renderRoute(); renderNotif(); }
      if (act.dataset.act === "decline") {
        Sheet.openWith({
          title: "Decline this request", sub: "The client sees your note immediately.",
          body: `<div class="field"><div class="label">Reason (optional)</div><textarea class="textarea" id="declineNote" placeholder="e.g. Already booked that week."></textarea></div>`,
          foot: `<button class="btn" id="decNo">Keep it</button><button class="btn danger" id="decYes">Decline</button>`,
          onMount: () => {
            $("#decNo").onclick = () => Sheet.close();
            $("#decYes").onclick = () => { setBookingStatus(id, "declined", $("#declineNote").value.trim()); Sheet.close(); toast("Declined"); renderRoute(); renderNotif(); };
          }
        });
      }
      return;
    }
    const th = e.target.closest("[data-thread]"); if (th) openThread(th.dataset.thread);
  };
  const lead = $("#leadSel");
  if (lead) lead.onchange = () => { c.availability.leadDays = Number(lead.value); saveDB(); toast("Minimum notice updated"); };
};

/* ------------------------------------------------- service editor sheet -- */
function openServiceSheet(serviceId) {
  const c = myCreator(); if (!c) return;
  const s = serviceId ? c.services.find(x => x.id === serviceId) : null;
  const state = {
    title: s ? s.title : "", category: s ? s.category : c.category,
    price: s ? s.price : "", unit: s ? s.unit : "day", description: s ? s.description : ""
  };
  Sheet.openWith({
    title: s ? "Edit service" : "Add a service",
    sub: "Title · category · charges · description — exactly how clients will see it.",
    wide: true,
    body: `
      <div class="col" style="gap:16px">
        <div class="field"><div class="label">Service title</div>
          <input class="input" id="svTitle" value="${esc(state.title)}" placeholder="e.g. Full-day wedding coverage"></div>
        <div class="grid g-2" style="gap:14px">
          <div class="field"><div class="label">Category</div>
            <select class="select" id="svCat">${CATEGORIES.map(x => `<option ${state.category === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
          <div class="field"><div class="label">Charges</div>
            <div class="row" style="gap:8px">
              <input class="input" id="svPrice" type="number" min="0" value="${state.price}" placeholder="25000" style="flex:1">
              <select class="select" id="svUnit" style="width:130px">${UNITS.map(u => `<option ${state.unit === u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>
            </div>
            <div class="xs faint">Shown as “₹25,000 / day”. Clients filter by this number.</div>
          </div>
        </div>
        <div class="field"><div class="label">Description</div>
          <textarea class="textarea" id="svDesc" placeholder="What's included, what's the deliverable, how long does it take?">${esc(state.description)}</textarea></div>
      </div>`,
    foot: `<button class="btn" id="svCancel">Cancel</button><button class="btn accent" id="svSave">${ico("check")} ${s ? "Save changes" : "Add to profile"}</button>`,
    onMount: () => {
      $("#svCancel").onclick = () => Sheet.close();
      $("#svSave").onclick = () => {
        const title = $("#svTitle").value.trim();
        const price = Number($("#svPrice").value);
        const desc = $("#svDesc").value.trim();
        if (!title) { toast("Give the service a title", "bad"); return; }
        if (!price || price <= 0) { toast("Enter the charge for this service", "bad"); return; }
        const payload = { title, category: $("#svCat").value, price, unit: $("#svUnit").value, description: desc || "Details shared on request." };
        if (s) Object.assign(s, payload);
        else c.services.push({ id: uid("sv"), ...payload });
        c.rateFrom = Math.min.apply(null, c.services.map(x => x.price));
        c.category = c.services[0].category;
        saveDB(); Sheet.close(); toast(s ? "Service updated" : "Service published");
        renderRoute();
      };
    }
  });
}

/* -------------------------------------------------------------- account -- */
VIEWS.account = () => {
  const u = currentUser(); if (!u) return "";
  const c = creatorByUser(u.id);
  const st = c ? allTimeStats(c.id) : null;
  const myBookingsCount = DB.bookings.filter(b => b.clientId === u.id).length;

  return `
  <section class="wrap" style="padding-top:30px;max-width:900px">
    <div class="sec-head"><div><div class="sec-eyebrow">Settings</div><h1 style="font-size:clamp(26px,3.2vw,38px)">Account</h1></div></div>

    <div class="card pad mb-16">
      <div class="row wrap-row" style="gap:18px">
        ${avatarHTML(u.name, 72, u.id)}
        <div class="grow">
          <h3>${esc(u.name)}</h3>
          <div class="small muted">${esc(u.email)} · ${u.role === "creator" ? "Creator account" : "Client account"}${u.company ? " · " + esc(u.company) : ""}</div>
          <div class="row wrap-row" style="gap:8px;margin-top:10px">
            <span class="tag">Member since ${MONTHS[new Date(u.createdAt).getMonth()]} ${new Date(u.createdAt).getFullYear()}</span>
            ${c ? `<span class="tag sage">${st.count} reviews · ${st.points} points</span>` : `<span class="tag">${myBookingsCount} bookings requested</span>`}
          </div>
        </div>
        <div class="row wrap-row" style="gap:8px">
          <button class="btn" id="editAcct">${ico("edit")} Edit details</button>
          ${c ? `<button class="btn accent" data-go="studio">${ico("layers")} Studio</button>` : `<button class="btn accent" id="becomeCreator">${ico("spark")} Become a creator</button>`}
        </div>
      </div>
    </div>

    <div class="grid g-2">
      <div class="card pad">
        <div class="sec-eyebrow">Contact</div>
        <div class="col" style="gap:10px;margin-top:8px">
          <div class="kv"><span class="k">City</span><span class="v">${esc(u.city || "—")}</span></div>
          <div class="kv"><span class="k">Phone</span><span class="v">${esc(u.phone || "—")}</span></div>
          ${u.company ? `<div class="kv"><span class="k">Company</span><span class="v">${esc(u.company)}</span></div>` : ""}
          <div class="kv"><span class="k">About</span><span class="v">${esc(u.about || "—")}</span></div>
        </div>
      </div>

      <div class="card pad">
        <div class="sec-eyebrow">Demo switchboard</div>
        <p class="small muted" style="margin:8px 0 12px">Jump between seeded accounts to see both sides of every flow. Passwords are all <span class="kbd">demo1234</span>.</p>
        <div class="col" style="gap:6px">
          ${DB.users.filter(x => ["aanya@kalaa.app", "kabir@kalaa.app", "tara@kalaa.app", "client@kalaa.app"].includes(x.email)).map(x => `
            <div class="lb-row" style="cursor:pointer;padding:10px 8px" data-switch="${x.id}">
              ${avatarHTML(x.name, 32, x.id)}
              <div class="grow">
                <div class="small" style="font-weight:500">${esc(x.name)}</div>
                <div class="xs faint">${esc(x.email)} · ${x.role}</div>
              </div>
              ${x.id === u.id ? `<span class="tag sage">current</span>` : `<span class="xs muted">switch ${ico("arrow")}</span>`}
            </div>`).join("")}
        </div>
      </div>

      <div class="card pad">
        <div class="sec-eyebrow">Your data</div>
        <p class="small muted" style="margin:8px 0 12px">This build stores everything in your browser — no server, no accounts to leak, no tracking. Reset to get the original seeded marketplace back.${Store.ok ? "" : ` <strong style="color:var(--clay)">Heads up: storage is blocked in this preview frame, so changes live only until you reload — download the file and open it directly for persistence.</strong>`}</p>
        <div class="row wrap-row" style="gap:8px">
          <button class="btn danger" id="resetAll">${ico("trash")} Reset demo data</button>
          <button class="btn" id="exportData">${ico("layers")} Export JSON</button>
        </div>
      </div>

      <div class="card pad">
        <div class="sec-eyebrow">Session</div>
        <div class="col" style="gap:12px;margin-top:8px">
          <div class="small muted">Signed in as <strong style="color:var(--ink)">${esc(u.email)}</strong></div>
          <button class="btn" id="signOut2">${ico("logout")} Sign out</button>
        </div>
      </div>
    </div>
  </section>`;
};

AFTER.account = () => {
  const root = $("#stage"); const u = currentUser(); if (!u || !$("#editAcct")) return;

  const sw = $$("[data-switch]");
  sw.forEach(el => el.onclick = () => {
    setSession(el.dataset.switch);
    const nu = currentUser();
    toast("Switched to " + nu.name + " (" + nu.role + ")");
    paintChrome(); renderNotif();
    go(nu.role === "creator" ? "studio" : "bookings");
  });

  $("#editAcct").onclick = () => openAccountSheet();
  const bc = $("#becomeCreator");
  if (bc) bc.onclick = () => {
    u.role = "creator";
    if (!creatorByUser(u.id)) {
      DB.creators.push({
        id: uid("cr"), userId: u.id, name: u.name, handle: u.email.split("@")[0],
        headline: "Tell clients what you do in one line", category: CATEGORIES[0],
        city: u.city || "India", country: "India", bio: u.about || "Add a short bio so clients know what to expect.",
        skills: [], languages: ["English"], modes: ["Remote"], rateFrom: 5000, currency: "INR",
        verified: false, responseRate: 100, joinedAt: nowTs(), bookedTotal: 0,
        cover: grad(u.name + "cover"),
        availability: { days: [1, 2, 3, 4, 5], slots: { Morning: true, Afternoon: true, Evening: false }, blocked: [], leadDays: 2, note: "" },
        services: [{ id: uid("sv"), title: "New service", category: CATEGORIES[0], price: 5000, unit: "session", description: "Describe what's included, the deliverable and the turnaround." }]
      });
    }
    saveDB(); toast("Creator account enabled — fill in your profile");
    paintChrome(); go("edit");
  };
  const reset = $("#resetAll"); if (reset) reset.onclick = () => { if (confirm("Reset all local demo data and reload?")) resetEverything(); };
  const exp = $("#exportData");
  if (exp) exp.onclick = () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "kalaa-data.json"; a.click();
    toast("Exported kalaa-data.json");
  };
  const so = $("#signOut2"); if (so) so.onclick = () => { setSession(null); toast("Signed out"); go("landing"); paintChrome(); renderNotif(); };
};

function openAccountSheet() {
  const u = currentUser(); if (!u) return;
  Sheet.openWith({
    title: "Edit details", sub: "Only visible to creators you book or who book you.",
    body: `
      <div class="col" style="gap:14px">
        <div class="field"><div class="label">Full name</div><input class="input" id="acName" value="${esc(u.name)}"></div>
        <div class="grid g-2" style="gap:14px">
          <div class="field"><div class="label">City</div><input class="input" id="acCity" value="${esc(u.city || "")}" placeholder="Chandigarh"></div>
          <div class="field"><div class="label">Phone</div><input class="input" id="acPhone" value="${esc(u.phone || "")}" placeholder="+91 …"></div>
        </div>
        <div class="field"><div class="label">Company (optional)</div><input class="input" id="acCompany" value="${esc(u.company || "")}" placeholder="For company bookings"></div>
        <div class="field"><div class="label">About you</div><textarea class="textarea" id="acAbout">${esc(u.about || "")}</textarea></div>
      </div>`,
    foot: `<button class="btn" id="acCancel">Cancel</button><button class="btn accent" id="acSave">Save</button>`,
    onMount: () => {
      $("#acCancel").onclick = () => Sheet.close();
      $("#acSave").onclick = () => {

        u.city = $("#acCity").value.trim();
        u.phone = $("#acPhone").value.trim();
